name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - releases/*

permissions:
  contents: read
  actions: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Is it the official main branch, or an official release branches?
  #
  # Variable IS_TEMPORALIO_SDK_TYPESCRIPT_REPO is configured to true on the official repo.
  # It can be used to determine if the present execution has access to secrets or not.
  #
  # AFAIK there's no way to break that line w/o introducing a trailing LF that breaks usage. Sorry.
  IS_MAIN_OR_RELEASE: ${{ vars.IS_TEMPORALIO_SDK_TYPESCRIPT_REPO == 'true' && github.event_name != 'pull_request' && ( github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/releases')) }}

  # Use these variables to force specific version of CLI/Time Skipping Server for SDK tests
  TESTS_CLI_VERSION: 'v1.7.4-standalone-nexus-operations'
  # TESTS_TIME_SKIPPING_SERVER_VERSION: 'v1.24.1'

jobs:
  # Compile native bridge code for each target platform.
  # Uploads the native library for each target as a build artifact.
  compile-native-binaries-debug:
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            out-file: libtemporal_sdk_typescript_bridge.so
          - platform: linux-arm
            runner: ubuntu-24.04-arm64-2-core
            target: aarch64-unknown-linux-gnu
            out-file: libtemporal_sdk_typescript_bridge.so
          - platform: macos-arm
            runner: macos-14
            target: aarch64-apple-darwin
            out-file: libtemporal_sdk_typescript_bridge.dylib
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            out-file: temporal_sdk_typescript_bridge.dll
    name: Compile Native Binaries (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: 'Cache index.node'
        id: cached-artifact
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ./packages/core-bridge/releases
          key: corebridge-artifactcache-debug-${{ matrix.platform }}-${{ hashFiles('./packages/core-bridge/**/Cargo.lock', './packages/core-bridge/**/*.rs') }}

      - name: Install protoc
        if: steps.cached-artifact.outputs.cache-hit != 'true'
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          # TODO: Upgrade proto once https://github.com/arduino/setup-protoc/issues/99 is fixed
          version: '23.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade Rust to latest stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust Cargo and Build cache
        if: steps.cached-artifact.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          workspaces: packages/core-bridge -> target
          prefix-key: corebridge-buildcache-debug
          shared-key: ${{ matrix.platform }}
          env-vars: ''
          save-if: ${{ env.IS_MAIN_OR_RELEASE == 'true' }}

      - name: Compile rust code
        if: steps.cached-artifact.outputs.cache-hit != 'true'
        working-directory: ./packages/core-bridge
        run: |
          set -x
          cargo build --target ${{ matrix.target }}
          mkdir -p ./releases/${{ matrix.target }}
          cp target/${{ matrix.target }}/debug/${{ matrix.out-file }} ./releases/${{ matrix.target }}/index.node

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: corebridge-native-debug-${{ matrix.platform }}
          # Actual file will be named ${{ matrix.target }}/index.node
          path: ./packages/core-bridge/releases/*/index.node

  # Run integration tests.
  # Uses the native binaries built in compile-native-binaries, but build `@temporalio/*` packages locally.
  integration-tests:
    timeout-minutes: 30
    needs:
      - compile-native-binaries-debug
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24, bun] # Min and max officially supported Node versions + Bun
        platform: [linux-x64, linux-arm, macos-arm, windows-x64]
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            # For efficiency, we only run non-reuse-v8-context tests on this platform
            reuse-v8-context: false
          - platform: linux-arm
            runner: ubuntu-24.04-arm64-2-core
            reuse-v8-context: true
          - platform: macos-arm
            runner: macos-14
            reuse-v8-context: true
          - platform: windows-x64
            runner: windows-latest
            reuse-v8-context: true
    runs-on: ${{ matrix.runner }}
    # Allow Bun test failures since support is experimental
    continue-on-error: ${{ matrix.node == 'bun' }}
    name: Run Integration Tests (${{ matrix.platform }}, ${{ matrix.node == 'bun' && 'Bun' || format('Node {0}', matrix.node) }}, Reuse V8 Context ${{ matrix.reuse-v8-context }})
    env:
      # Per-package result JSON + full logs are written here by scripts/ava-ci.ts,
      # archived as the test-logs-* artifact, and aggregated by the ci-summary job.
      TEST_RESULTS_DIR: ${{ github.workspace }}/.test-results
    defaults:
      run:
        shell: bash
    steps:
      # For some unknown reason, execution of TSC may sometime introduce a CRLF/LF mismatch on some
      # pure JS files that are preserved in the repo, which would later cause a failure when trying
      # to publish packages to Verdaccio, as `pnpm publish` requires that the Git repo be clean.
      - name: Set git config
        run: git config --global core.autocrlf false

      - name: 'Checkout code'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Download core-bridge native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: corebridge-native-debug-${{ matrix.platform }}
          path: ./packages/core-bridge/releases

      - name: Setup Node and Install Dependencies
        if: matrix.node != 'bun'
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ matrix.node-release-override || matrix.node }}
          platform: ${{ matrix.platform }}

      - name: Setup Bun and Install Dependencies
        if: matrix.node == 'bun'
        uses: ./.github/actions/setup-bun-deps
        with:
          platform: ${{ matrix.platform }}

      # On Windows, the 'runner.temp' variable uses backslashes as path separators, but
      # that may pose problems in later steps when we try to join that with subpaths;
      # e.g. '${{ runner.temp }}/npm-registry' would get interpolated to 'd:\a\_temp/npm-registry',
      # which may effectively get interpreted as by bash as 'd:a_temp/npm-registry', resulting in
      # the apparition of an unwanted 'a_temp' directory.
      #
      # This step ensures that the 'runner.temp' variable is normalized to use forward slashes.
      - name: Get normalized path to temp directory
        id: tmp-dir
        run: echo "dir=$(pwd)" >> ${GITHUB_OUTPUT}
        working-directory: ${{ runner.temp }}

      - name: Compile code
        run: pnpm --recursive --stream --filter '!@temporalio/core-bridge' --filter '!typescript-sdk' run build

      - name: Publish to Verdaccio
        run: pnpm tsx scripts/publish-to-verdaccio.ts --registry-dir ${{ steps.tmp-dir.outputs.dir }}/npm-registry

      - name: Install Temporal CLI
        uses: temporalio/setup-temporal@8bde337644eaaa6644b8b527d9a8406c2207de5b # v0
        with:
          version: ${{ env.TESTS_CLI_VERSION }}

      - name: Run Temporal CLI
        working-directory: ${{ runner.temp }}
        run: |
          temporal server start-dev \
            --db-filename temporal.sqlite \
            --sqlite-pragma journal_mode=WAL \
            --sqlite-pragma synchronous=OFF \
            --headless &> ./devserver.log \
            --dynamic-config-value system.enableActivityEagerExecution=true \
            --dynamic-config-value history.enableRequestIdRefLinks=true \
            --dynamic-config-value frontend.activityAPIsEnabled=true \
            --dynamic-config-value activity.enableStandalone=true \
            --dynamic-config-value activity.startDelayEnabled=true \
            --dynamic-config-value 'activity.longPollTimeout="5000ms"' \
            --dynamic-config-value history.enableChasm=true \
            --dynamic-config-value history.enableTransitionHistory=true &

      - name: Run Tests (Node)
        if: matrix.node != 'bun'
        run: pnpm run test
        env:
          RUN_INTEGRATION_TESTS: true
          REUSE_V8_CONTEXT: ${{ matrix.reuse-v8-context }}

          # For Temporal Cloud + mTLS tests
          TEMPORAL_CLOUD_MTLS_TEST_TARGET_HOST: ${{ vars.TEMPORAL_CLIENT_NAMESPACE }}.tmprl.cloud:7233
          TEMPORAL_CLOUD_MTLS_TEST_NAMESPACE: ${{ vars.TEMPORAL_CLIENT_NAMESPACE }}
          TEMPORAL_CLOUD_MTLS_TEST_CLIENT_CERT: ${{ secrets.TEMPORAL_CLIENT_CERT }}
          TEMPORAL_CLOUD_MTLS_TEST_CLIENT_KEY: ${{ secrets.TEMPORAL_CLIENT_KEY }}

          # For Temporal Cloud + API key tests
          TEMPORAL_CLOUD_API_KEY_TEST_TARGET_HOST: ca-central-1.aws.api.temporal.io:7233
          TEMPORAL_CLOUD_API_KEY_TEST_NAMESPACE: ${{ vars.TEMPORAL_CLIENT_NAMESPACE }}
          TEMPORAL_CLOUD_API_KEY_TEST_API_KEY: ${{ secrets.TEMPORAL_CLIENT_CLOUD_API_KEY }}

          # For Temporal Cloud + Cloud Ops tests
          TEMPORAL_CLOUD_OPS_TEST_TARGET_HOST: saas-api.tmprl.cloud:443
          TEMPORAL_CLOUD_OPS_TEST_NAMESPACE: ${{ vars.TEMPORAL_CLIENT_NAMESPACE }}
          TEMPORAL_CLOUD_OPS_TEST_API_KEY: ${{ secrets.TEMPORAL_CLIENT_CLOUD_API_KEY }}
          TEMPORAL_CLOUD_OPS_TEST_API_VERSION: 2024-05-13-00

      - name: Run Tests (Bun)
        if: matrix.node == 'bun'
        working-directory: packages/test
        # Same wrapper as the Node path, but AVA_RUNTIME=bun makes it launch ava
        # under Bun (mirrors `bun run -b ava`), so Bun is still exercised. Bun runs
        # the TypeScript wrapper directly (no tsx needed).
        run: bun ../../scripts/ava-ci.ts ./lib/test-*.js
        env:
          AVA_RUNTIME: bun
          RUN_INTEGRATION_TESTS: true
          REUSE_V8_CONTEXT: ${{ matrix.reuse-v8-context }}

      # (Per-package results are printed by the wrapper into the "Run Tests" log
      # above, and aggregated across all jobs by the `ci-summary` job below.)

      # FIXME: Move samples tests to a custom activity
      # Sample 1: hello-world to local server
      - name: Instantiate sample project using verdaccio artifacts - Hello World
        if: matrix.node != 'bun'
        run: |
          pnpm tsx scripts/init-from-verdaccio.ts --registry-dir ${{ steps.tmp-dir.outputs.dir }}/npm-registry --sample https://github.com/temporalio/samples-typescript/tree/main/hello-world --target-dir ${{ steps.tmp-dir.outputs.dir }}/sample-hello-world
          pnpm tsx scripts/test-example.ts --work-dir "${{ steps.tmp-dir.outputs.dir }}/sample-hello-world"

      # Sample 2: hello-world-mtls to cloud server
      - name: Instantiate sample project using verdaccio artifacts - Hello World MTLS
        if: matrix.node != 'bun'
        run: |
          if [ -z "$TEMPORAL_ADDRESS" ] || [ -z "$TEMPORAL_NAMESPACE" ] || [ -z "$TEMPORAL_CLIENT_CERT" ] || [ -z "$TEMPORAL_CLIENT_KEY" ]; then
            echo "Skipping hello-world-mtls sample test as required environment variables are not set"
            exit 0
          fi

          pnpm tsx scripts/create-certs-dir.ts ${{ steps.tmp-dir.outputs.dir }}/certs
          pnpm tsx scripts/init-from-verdaccio.ts --registry-dir ${{ steps.tmp-dir.outputs.dir }}/npm-registry --sample https://github.com/temporalio/samples-typescript/tree/main/hello-world-mtls --target-dir ${{ steps.tmp-dir.outputs.dir }}/sample-hello-world-mtls
          pnpm tsx scripts/test-example.ts --work-dir "${{ steps.tmp-dir.outputs.dir }}/sample-hello-world-mtls"
        env:
          # These env vars are used by the hello-world-mtls sample
          TEMPORAL_ADDRESS: ${{ vars.TEMPORAL_CLIENT_NAMESPACE }}.tmprl.cloud:7233
          TEMPORAL_NAMESPACE: ${{ vars.TEMPORAL_CLIENT_NAMESPACE }}
          TEMPORAL_CLIENT_CERT: ${{ secrets.TEMPORAL_CLIENT_CERT }}
          TEMPORAL_CLIENT_KEY: ${{ secrets.TEMPORAL_CLIENT_KEY }}
          TEMPORAL_TASK_QUEUE: ${{ format('tssdk-ci-{0}-{1}-sample-hello-world-mtls-{2}-{3}', matrix.platform, matrix.node, github.run_id, github.run_attempt) }}

          TEMPORAL_CLIENT_CERT_PATH: ${{ steps.tmp-dir.outputs.dir }}/certs/client.pem
          TEMPORAL_CLIENT_KEY_PATH: ${{ steps.tmp-dir.outputs.dir }}/certs/client.key

      - name: Destroy certs dir
        if: always() && matrix.node != 'bun'
        run: rm -rf ${{ steps.tmp-dir.outputs.dir }}/certs
        continue-on-error: true

      # Sample 3: fetch-esm to local server
      - name: Instantiate sample project using verdaccio artifacts - Fetch ESM
        if: matrix.node != 'bun'
        run: |
          pnpm tsx scripts/init-from-verdaccio.ts --registry-dir ${{ steps.tmp-dir.outputs.dir }}/npm-registry --sample https://github.com/temporalio/samples-typescript/tree/main/fetch-esm --target-dir ${{ steps.tmp-dir.outputs.dir }}/sample-fetch-esm
          pnpm tsx scripts/test-example.ts --work-dir "${{ steps.tmp-dir.outputs.dir }}/sample-fetch-esm" --script-name workflow-local --expected-output "Hello World And Hello Wonderful Temporal!"

      # End samples

      # Archive the full per-package test logs plus the redirected Verdaccio-publish
      # and sample-init logs (the firehose we keep off the console). Placed at the end
      # so it captures logs written by the sample steps above too.
      - name: Upload test logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-logs-${{ matrix.platform }}-${{ matrix.node }}-${{ matrix.reuse-v8-context && 'reuse' || 'noreuse' }}
          path: ${{ env.TEST_RESULTS_DIR }}
          retention-days: 7
          if-no-files-found: ignore
          # TEST_RESULTS_DIR is a dot-directory (.test-results); upload-artifact
          # excludes files under dot-dirs unless this is set, which would leave the
          # ci-summary job with no results to report.
          include-hidden-files: true

      - name: Upload Dev Server logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure() || cancelled()
        with:
          name: integration-tests-${{ matrix.platform }}-${{ matrix.node }}-${{ matrix.reuse-v8-context && 'reuse' || 'noreuse' }}-devserver-logs
          path: ${{ steps.tmp-dir.outputs.dir }}/devserver.log

  cloud-integration-tests:
    name: Cloud Integration Tests
    if: ${{ vars.IS_TEMPORALIO_SDK_TYPESCRIPT_REPO == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 40
    needs:
      - compile-native-binaries-debug
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Download core-bridge native library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: corebridge-native-debug-linux-x64
          path: ./packages/core-bridge/releases

      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24
          platform: linux-x64

      - name: Compile code
        run: pnpm --recursive --stream --filter '!@temporalio/core-bridge' --filter '!typescript-sdk' run build

      - name: Generate Cloud test certificates
        run: |
          cert_dir="$RUNNER_TEMP/cloud-test-certs"
          mkdir "$cert_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$cert_dir/ca.key" -out "$cert_dir/ca.pem" \
            -subj '/CN=Temporal TypeScript SDK Cloud CI CA'
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$cert_dir/client.key" -out "$cert_dir/client.csr" \
            -subj '/CN=Temporal TypeScript SDK Cloud CI'
          openssl x509 -req -days 1 -in "$cert_dir/client.csr" \
            -CA "$cert_dir/ca.pem" -CAkey "$cert_dir/ca.key" -CAcreateserial \
            -out "$cert_dir/client.pem" -extfile <(printf 'extendedKeyUsage=clientAuth')
          {
            echo "TEMPORAL_CLOUD_CLIENT_CA_PATH=$cert_dir/ca.pem"
            echo "TEMPORAL_TLS_CLIENT_CERT_PATH=$cert_dir/client.pem"
            echo "TEMPORAL_TLS_CLIENT_KEY_PATH=$cert_dir/client.key"
          } >> "$GITHUB_ENV"

      - name: Create Cloud namespace
        id: create-cloud-namespace
        run: pnpm exec tsx .github/scripts/cloud-namespace.ts create
        env:
          TEMPORAL_CLIENT_CLOUD_API_KEY: ${{ secrets.TEMPORAL_CLIENT_CLOUD_API_KEY }}
          TEMPORAL_CLIENT_CLOUD_API_VERSION: v0.19.1

      - name: Run tests against Temporal Cloud
        # Fail a hung suite while leaving job-level time for namespace cleanup and log upload.
        timeout-minutes: 20
        run: pnpm --silent test:cloud | tee cloud-integration.tap
        env:
          RUN_INTEGRATION_TESTS: true
          REUSE_V8_CONTEXT: true
          TEMPORAL_TEST_ENV_CONFIG_SERVER: true
          TEMPORAL_ADDRESS: ${{ steps.create-cloud-namespace.outputs.namespace }}.tmprl.cloud:7233
          TEMPORAL_NAMESPACE: ${{ steps.create-cloud-namespace.outputs.namespace }}

      - name: Delete Cloud namespace
        if: ${{ always() && steps.create-cloud-namespace.outputs.namespace != '' }}
        run: pnpm exec tsx .github/scripts/cloud-namespace.ts delete "${{ steps.create-cloud-namespace.outputs.namespace }}"
        env:
          TEMPORAL_CLIENT_CLOUD_API_KEY: ${{ secrets.TEMPORAL_CLIENT_CLOUD_API_KEY }}
          TEMPORAL_CLIENT_CLOUD_API_VERSION: v0.19.1

      - name: Upload Cloud test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloud-integration-tests-output
          path: cloud-integration.tap
          if-no-files-found: ignore
          retention-days: 14

  conventions:
    name: Lint and Prune
    uses: ./.github/workflows/conventions.yml

  # Runs the features repo tests with this repo's current SDK code
  # FIXME: Update this job to reuse native build artifacts from compile-native-binaries
  features-tests:
    name: Features Tests
    uses: temporalio/features/.github/workflows/typescript.yaml@main
    with:
      typescript-repo-path: ${{github.event.pull_request.head.repo.full_name}}
      version: ${{github.event.pull_request.head.ref}}
      version-is-repo-ref: true
      # FIXME: Remove this once 1) our protobufjs v8 bump has been merged and included in a
      # release, and 2) https://github.com/temporalio/features/pull/863 has been merged to main.
      features-repo-ref: bump-protobufjs

  stress-tests-no-reuse-context:
    name: Stress Tests (No Reuse V8 Context)
    # FIXME: Update this job to reuse native build artifacts from compile-native-binaries
    uses: ./.github/workflows/stress.yml
    with:
      test-type: ci-stress
      test-timeout-minutes: 20
      reuse-v8-context: false

  stress-tests-reuse-context:
    name: Stress Tests (Reuse V8 Context)
    # FIXME: Update this job to reuse native build artifacts from compile-native-binaries
    uses: ./.github/workflows/stress.yml
    with:
      test-type: ci-stress
      test-timeout-minutes: 20
      reuse-v8-context: true

  docs:
    name: Build Docs
    uses: ./.github/workflows/docs.yml
    with:
      # Can't publish from forks, as secrets won't be available
      publish_target: ${{ vars.IS_TEMPORALIO_SDK_TYPESCRIPT_REPO == 'true' && 'draft' || '' }}
    secrets:
      ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  ci-summary:
    name: CI
    if: always()
    needs:
      - compile-native-binaries-debug
      - integration-tests
      - cloud-integration-tests
      - conventions
      - features-tests
      - stress-tests-no-reuse-context
      - stress-tests-reuse-context
      - docs
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          # This job installs no dependencies, so it runs ci-run-summary.ts through
          # Node's native type stripping rather than tsx. That needs Node >= 23.6.
          node-version: '24'

      - name: Download test result artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: test-logs-*
          path: all-results
        continue-on-error: true

      - name: Collect per-cell job results
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" > jobs.json || echo '{}' > jobs.json

      - name: Write consolidated summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          AGG_RESULTS_DIR: all-results
          JOBS_JSON_FILE: jobs.json
        run: node scripts/ci-run-summary.ts

      # Make this rollup check red when any dependency failed (the summary above is
      # written by the previous step regardless, so it always renders).
      - name: Fail if any check failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          echo "One or more checks failed — see the CI Summary above."
          exit 1
