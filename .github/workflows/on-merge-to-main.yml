name: On merge to main

on:
  push:
    # releases/* branches are main-like: they only change by merge
    branches:
      - main
      - 'releases/*'

permissions:
  contents: read
  actions: write

jobs:
  # Compile native binaries, build the @temporalio/* packages and test them on every platform.
  build-and-test:
    name: Build and Test
    uses: ./.github/workflows/build-and-test.yml
    with:
      # Release tarballs are only needed on release branches
      pack: ${{ startsWith(github.ref, 'refs/heads/releases/') }}
    secrets: inherit

  docs:
    name: Build Docs
    uses: ./.github/workflows/docs.yml
    with:
      publish_target: prod
    secrets:
      ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
