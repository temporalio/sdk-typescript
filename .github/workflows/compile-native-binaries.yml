name: Compile Native Binaries

on:
  workflow_call:
    inputs:
      profile:
        description: Cargo profile to build with, either 'debug' or 'release'
        required: true
        type: string

permissions:
  contents: read
  actions: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Is it the official main branch, or an official release branches?
  # AFAIK there's no way to break that line w/o introducing a trailing LF that breaks usage. Sorry.
  IS_MAIN_OR_RELEASE: ${{ vars.IS_TEMPORALIO_SDK_TYPESCRIPT_REPO == 'true' && github.event_name != 'pull_request' && ( github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/releases')) }}

  # Suffix of the cache keys and artifact names, so that debug and release builds never mix
  DEBUG_SUFFIX: ${{ inputs.profile == 'debug' && '-debug' || '' }}

jobs:
  # Compile native bridge code for each target platform.
  # Uploads the native library for each target as a build artifact.
  compile-native-binaries:
    env:
      PROFILE: ${{ inputs.profile }}
    timeout-minutes: ${{ inputs.profile == 'debug' && 20 || 360 }}
    strategy:
      fail-fast: true
      matrix:
        # Debug builds skip macos-x64, and build Linux binaries natively rather than in a manylinux container
        include: >-
          ${{ fromJSON(inputs.profile == 'release' && '[
          {"platform": "linux-x64", "runner": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "container": "quay.io/pypa/manylinux_2_24_x86_64", "out-file": "libtemporal_sdk_typescript_bridge.so", "protobuf-url": "https://github.com/protocolbuffers/protobuf/releases/download/v22.3/protoc-22.3-linux-x86_64.zip"},
          {"platform": "linux-arm", "runner": "ubuntu-24.04-arm64-2-core", "target": "aarch64-unknown-linux-gnu", "container": "quay.io/pypa/manylinux_2_24_aarch64", "out-file": "libtemporal_sdk_typescript_bridge.so", "protobuf-url": "https://github.com/protocolbuffers/protobuf/releases/download/v22.3/protoc-22.3-linux-aarch_64.zip"},
          {"platform": "macos-x64", "runner": "macos-15-intel", "target": "x86_64-apple-darwin", "out-file": "libtemporal_sdk_typescript_bridge.dylib"},
          {"platform": "macos-arm", "runner": "macos-15", "target": "aarch64-apple-darwin", "out-file": "libtemporal_sdk_typescript_bridge.dylib"},
          {"platform": "windows-x64", "runner": "windows-latest", "target": "x86_64-pc-windows-msvc", "out-file": "temporal_sdk_typescript_bridge.dll"}
          ]' || '[
          {"platform": "linux-x64", "runner": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "out-file": "libtemporal_sdk_typescript_bridge.so"},
          {"platform": "linux-arm", "runner": "ubuntu-24.04-arm64-2-core", "target": "aarch64-unknown-linux-gnu", "out-file": "libtemporal_sdk_typescript_bridge.so"},
          {"platform": "macos-arm", "runner": "macos-15", "target": "aarch64-apple-darwin", "out-file": "libtemporal_sdk_typescript_bridge.dylib"},
          {"platform": "windows-x64", "runner": "windows-latest", "target": "x86_64-pc-windows-msvc", "out-file": "temporal_sdk_typescript_bridge.dll"}
          ]') }}
    name: Compile Native Binaries (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: 'Cache native index.node artifacts'
        id: cached-artifact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./packages/core-bridge/releases
          key: corebridge-artifactcache${{ env.DEBUG_SUFFIX }}-${{ matrix.platform }}-${{ hashFiles('./packages/core-bridge/**/Cargo.lock', './packages/core-bridge/**/*.rs') }}

      - name: Install protoc
        if: steps.cached-artifact.outputs.cache-hit != 'true' && !matrix.container
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          # TODO: Upgrade proto once https://github.com/arduino/setup-protoc/issues/99 is fixed
          version: '23.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade Rust to latest stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # FIXME: Setup volumes so that we can benefit from the cache in the Docker-build scenario.
      #        Or maybe just get rid of the cache entirely if it doesn't have sufficient benefits.
      - name: Rust Cargo and Build cache
        if: steps.cached-artifact.outputs.cache-hit != 'true' && !matrix.container
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          workspaces: packages/core-bridge -> target
          prefix-key: corebridge-buildcache${{ env.DEBUG_SUFFIX }}
          shared-key: ${{ matrix.platform }}
          env-vars: ''
          save-if: ${{ env.IS_MAIN_OR_RELEASE == 'true' }}

      - name: Compile rust code (non-Docker)
        if: steps.cached-artifact.outputs.cache-hit != 'true' && !matrix.container
        working-directory: ./packages/core-bridge
        run: |
          if [ "$PROFILE" = release ]; then
            cargo build --release --target ${{ matrix.target }}
          else
            cargo build --target ${{ matrix.target }}
          fi

      - name: Compile rust code (Docker)
        if: steps.cached-artifact.outputs.cache-hit != 'true' && matrix.container
        working-directory: ./packages/core-bridge
        run: |
          docker run --rm -e PROFILE -v "$(pwd):/workspace" -w /workspace \
            ${{ matrix.container }} \
            sh -c '
                curl https://sh.rustup.rs -sSf | sh -s -- --default-toolchain stable -y
                curl -L -o /tmp/protoc.zip ${{ matrix.protobuf-url }}
                unzip /tmp/protoc.zip -d $HOME/.protobuf
                export PATH="$PATH:$HOME/.cargo/bin:$HOME/.protobuf/bin"

                if [ "$PROFILE" = release ]; then
                  cargo build --release --target ${{ matrix.target }}
                else
                  cargo build --target ${{ matrix.target }}
                fi
            '

      - name: Move built artifacts in place
        if: steps.cached-artifact.outputs.cache-hit != 'true'
        working-directory: ./packages/core-bridge
        run: |
          mkdir -p ./releases/${{ matrix.target }}
          cp "target/${{ matrix.target }}/$PROFILE/${{ matrix.out-file }}" "./releases/${{ matrix.target }}/index.node"

      - name: Print required GLIBC version
        if: inputs.profile == 'release' && startsWith(matrix.platform, 'linux')
        working-directory: ./packages/core-bridge
        run: |
          objdump -T ./releases/${{ matrix.target }}/index.node |
              grep GLIBC | sed 's/.*GLIBC_\([.0-9]*\).*/\1/g' | sort -V | tail -1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: corebridge-native${{ env.DEBUG_SUFFIX }}-${{ matrix.platform }}
          # Actual file will be named ${{ matrix.target }}/index.node
          path: ./packages/core-bridge/releases/*/index.node
