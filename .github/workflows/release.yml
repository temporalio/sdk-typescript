name: Build Package

on:
  push:
    branches:
      - main
      - 'releases/*'

permissions:
  contents: read
  actions: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Is it the official main branch, or an official release branches?
  # AFAIK there's no way to break that line w/o introducing a trailing LF that breaks usage. Sorry.
  IS_MAIN_OR_RELEASE: ${{ vars.IS_TEMPORALIO_SDK_TYPESCRIPT_REPO == 'true' && github.event_name != 'pull_request' && ( github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/releases')) }}

  # Use these variables to force specific version of CLI/Time Skipping Server for SDK tests
  # TEMP(event-groups): pin to a CLI build with Event Groups support until it lands in a default release.
  TESTS_CLI_VERSION: 'v1.7.4-standalone-nexus-operations'
  # TESTS_TIME_SKIPPING_SERVER_VERSION: 'v1.24.1'

jobs:
  release-notes:
    name: Generate release notes
    if: startsWith(github.ref, 'refs/heads/releases/') || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Generate completed changelog and Core commit notes
        shell: bash
        run: |
          VERSION=$(node -p 'require("./packages/common/package.json").version')
          cargo run --manifest-path packages/core-bridge/sdk-core/crates/changelog-release-notes/Cargo.toml \
            --bin changelog-tool -- release-notes --repo "$PWD" \
            --submodule packages/core-bridge/sdk-core --version "$VERSION" --output release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: release-notes.md

  build-and-test:
    name: Build and Test
    uses: ./.github/workflows/build-and-test.yml
    secrets: inherit

  conventions:
    name: Lint and Prune
    uses: ./.github/workflows/conventions.yml

  docs:
    name: Build Docs
    uses: ./.github/workflows/docs.yml
    with:
      publish_target: prod
    secrets:
      ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
