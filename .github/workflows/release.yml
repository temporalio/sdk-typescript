name: Build Package

on:
  push:
    branches:
      - main
      - 'releases/*'

permissions:
  contents: read
  actions: write

jobs:
  release-notes:
    name: Generate release notes
    if: startsWith(github.ref, 'refs/heads/releases/') || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Generate completed changelog and Core commit notes
        shell: bash
        run: |
          VERSION=$(node -p 'require("./packages/common/package.json").version')
          cargo run --manifest-path packages/core-bridge/sdk-core/crates/changelog-release-notes/Cargo.toml \
            --bin changelog-tool -- release-notes --repo "$PWD" \
            --submodule packages/core-bridge/sdk-core --version "$VERSION" --output release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: release-notes.md

  # Compile native binaries, build the @temporalio/* packages and test them on every platform.
  build-and-test:
    name: Build and Test
    uses: ./.github/workflows/build-and-test.yml
    with:
      # Release tarballs are only needed on release branches
      pack: ${{ startsWith(github.ref, 'refs/heads/releases/') }}
    secrets: inherit

  conventions:
    name: Lint and Prune
    uses: ./.github/workflows/conventions.yml

  docs:
    name: Build Docs
    uses: ./.github/workflows/docs.yml
    with:
      publish_target: prod
    secrets:
      ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
