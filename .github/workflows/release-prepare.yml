name: Release Prepare

# Opens the version-bump pull request. All of the work happens in
# `pnpm release:prepare --open-pr`; this file only supplies the runner,
# the toolchain, and a token that can push.

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: Release branch (main or releases/X.Y.x)
        required: true
        type: string
      version:
        description: Version to prepare, without a v prefix (1.26.0 or 1.26.0-rc.1)
        required: true
        type: string
      release_type:
        description: Release type
        required: true
        type: choice
        options:
          - ga
          - rc
          - beta
          - alpha

permissions:
  contents: read

concurrency:
  group: release-prepare-${{ inputs.release_branch }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mint a Temporal CI token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.TEMPORAL_CICD_APP_ID }}
          private-key: ${{ secrets.TEMPORAL_CICD_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout the release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_branch }}
          token: ${{ steps.app-token.outputs.token }}
          submodules: recursive
          fetch-depth: 0

      # actions/checkout leaves a detached HEAD. The script decides which branch
      # it is on by name, so attach the branch before running it.
      - name: Attach the release branch
        run: git checkout -B "${{ inputs.release_branch }}"

      - name: Set up Node and install dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          platform: linux-x64

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Prepare the release pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: temporal-cicd[bot]
          GIT_AUTHOR_EMAIL: temporal-cicd[bot]@users.noreply.github.com
        run: pnpm release:prepare "${{ inputs.version }}" --release-type "${{ inputs.release_type }}" --open-pr
