name: Release Prepare
run-name: Prepare ${{ inputs.version }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to prepare, without a v prefix (e.g. 1.26.0 or 1.26.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-prepare-${{ github.ref }}

jobs:
  prepare:
    name: Open the version bump pull request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Create a Temporal CI/CD token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.TEMPORAL_CICD_APP_ID }}
          private-key: ${{ secrets.TEMPORAL_CICD_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          repositories: ${{ github.event.repository.name }}

      - name: Checkout the release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: recursive
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-deps
        with:
          platform: linux-x64

      - name: Prepare the release and open the pull request
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: pnpm release:prepare "$VERSION" --open-pr
