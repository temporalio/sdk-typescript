name: Release Build

# Builds the release commit, packs the publishable packages, and opens a draft
# GitHub Release. Nothing is published to npm here. Publishing happens when a
# person publishes the draft.

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: Release branch (main or releases/X.Y.x)
        required: true
        type: string
      version:
        description: Version to build, without a v prefix (1.26.0 or 1.26.0-rc.1)
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: release-build-${{ inputs.release_branch }}-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve release commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Checkout the release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_branch }}
          fetch-depth: 1
      - name: Record the commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build and Test
    needs: resolve
    uses: ./.github/workflows/build-and-test.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      pack: true
      version: ${{ inputs.version }}
    secrets: inherit

  draft:
    name: Open draft release
    needs: [resolve, build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node and install dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          platform: linux-x64

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Download packed tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-tarballs
          path: dist

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm tsx scripts/release-draft.ts --version "${{ inputs.version }}" --tarballs dist --target "${{ needs.resolve.outputs.sha }}"
