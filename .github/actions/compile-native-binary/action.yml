# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Compile native bridge binary
description: Build one core-bridge target and upload it as an artifact

inputs:
  profile:
    description: Cargo profile, either debug or release
    required: true
  platform:
    description: Platform name used in cache keys and the artifact name
    required: true
  target:
    description: Rust target triple
    required: true
  out-file:
    description: Built library filename for this target
    required: true
  container:
    description: Manylinux image. Empty builds natively
    required: false
    default: ''
  protobuf-url:
    description: Protoc zip to install inside the manylinux image
    required: false
    default: ''
  cache-suffix:
    description: Appended to cache keys and the artifact name. Debug builds pass -debug
    required: false
    default: ''
  save-cache:
    description: Whether to save the Rust build cache
    required: true
  github-token:
    description: Token for the protoc setup action
    required: true

runs:
  using: composite
  steps:
    - name: Cache native index.node artifacts
      id: cached-artifact
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./packages/core-bridge/releases
        key: corebridge-artifactcache${{ inputs.cache-suffix }}-${{ inputs.platform }}-${{ hashFiles('./packages/core-bridge/**/Cargo.lock', './packages/core-bridge/**/*.rs') }}

    - name: Install protoc
      if: steps.cached-artifact.outputs.cache-hit != 'true' && inputs.container == ''
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
      with:
        # Keep in sync with sdk-core's mise.toml and the manylinux protobuf-url in on-merge-to-main.yml
        version: '23.4'
        repo-token: ${{ inputs.github-token }}

    - name: Upgrade Rust to latest stable
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

    # FIXME: Setup volumes so that we can benefit from the cache in the Docker-build scenario.
    #        Or maybe just get rid of the cache entirely if it doesn't have sufficient benefits.
    - name: Rust Cargo and Build cache
      if: steps.cached-artifact.outputs.cache-hit != 'true' && inputs.container == ''
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        cache-bin: false
        workspaces: packages/core-bridge -> target
        prefix-key: corebridge-buildcache${{ inputs.cache-suffix }}
        shared-key: ${{ inputs.platform }}
        env-vars: ''
        save-if: ${{ inputs.save-cache == 'true' }}

    - name: Compile rust code (non-Docker)
      if: steps.cached-artifact.outputs.cache-hit != 'true' && inputs.container == ''
      shell: bash
      working-directory: ./packages/core-bridge
      env:
        PROFILE: ${{ inputs.profile }}
        TARGET: ${{ inputs.target }}
      run: |
        if [ "$PROFILE" = release ]; then
          cargo build --release --target "$TARGET"
        else
          cargo build --target "$TARGET"
        fi

    - name: Compile rust code (Docker)
      if: steps.cached-artifact.outputs.cache-hit != 'true' && inputs.container != ''
      shell: bash
      working-directory: ./packages/core-bridge
      env:
        PROFILE: ${{ inputs.profile }}
        TARGET: ${{ inputs.target }}
        CONTAINER: ${{ inputs.container }}
        PROTOBUF_URL: ${{ inputs.protobuf-url }}
      run: |
        docker run --rm -e PROFILE -e TARGET -e PROTOBUF_URL -v "$(pwd):/workspace" -w /workspace \
          "$CONTAINER" \
          sh -c '
              curl https://sh.rustup.rs -sSf | sh -s -- --default-toolchain stable -y
              curl -L -o /tmp/protoc.zip "$PROTOBUF_URL"
              unzip /tmp/protoc.zip -d $HOME/.protobuf
              export PATH="$PATH:$HOME/.cargo/bin:$HOME/.protobuf/bin"

              if [ "$PROFILE" = release ]; then
                cargo build --release --target "$TARGET"
              else
                cargo build --target "$TARGET"
              fi
          '

    - name: Move built artifacts in place
      if: steps.cached-artifact.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ./packages/core-bridge
      env:
        PROFILE: ${{ inputs.profile }}
        TARGET: ${{ inputs.target }}
        OUT_FILE: ${{ inputs.out-file }}
      run: |
        mkdir -p "./releases/$TARGET"
        cp "target/$TARGET/$PROFILE/$OUT_FILE" "./releases/$TARGET/index.node"

    - name: Print required GLIBC version
      if: inputs.profile == 'release' && startsWith(inputs.platform, 'linux')
      shell: bash
      working-directory: ./packages/core-bridge
      env:
        TARGET: ${{ inputs.target }}
      run: |
        objdump -T "./releases/$TARGET/index.node" |
            grep GLIBC | sed 's/.*GLIBC_\([.0-9]*\).*/\1/g' | sort -V | tail -1

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: corebridge-native${{ inputs.cache-suffix }}-${{ inputs.platform }}
        # Actual file will be named ${{ inputs.target }}/index.node
        path: ./packages/core-bridge/releases/*/index.node
