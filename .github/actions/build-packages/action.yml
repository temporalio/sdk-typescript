name: 'Build packages'
description: 'Collect native bridge binaries, compile the @temporalio/* packages, and pack them into tarballs'

inputs:
  platform:
    description: 'Platform identifier for the dependency cache key (e.g. linux-x64)'
    required: true
  pattern:
    description: 'Artifact name pattern for the core-bridge binaries to collect'
    required: false
    default: 'corebridge-native-*'
  require-all:
    description: 'Whether to require every release target to be present after collecting'
    required: false
    default: 'false'
  save-cache:
    description: 'Whether to save the NPM cache (passed through to setup-node-deps)'
    required: false
    default: 'false'

outputs:
  tarball-dir:
    description: 'Directory containing the packed tarballs'
    value: ${{ steps.tmp.outputs.tarball-dir }}

runs:
  using: 'composite'
  steps:
    - name: Download workflow Wasm plugin
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: workflow-plugin-${{ inputs.platform }}
        path: ./packages/worker/lib/workflow/bundler

    - name: Download core-bridge native libraries
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        pattern: ${{ inputs.pattern }}
        path: ./tmp/corebridge

    - name: Setup Node and Install Dependencies
      uses: ./.github/actions/setup-node-deps
      with:
        node-version: '22'
        platform: ${{ inputs.platform }}
        save-cache: ${{ inputs.save-cache }}

    - name: Put native files into place
      shell: bash
      env:
        REQUIRE_ALL: ${{ inputs.require-all }}
      run: |
        if [ "$REQUIRE_ALL" = true ]; then
          pnpm bridge:collect --from ./tmp/corebridge --require-all
        else
          pnpm bridge:collect --from ./tmp/corebridge
        fi

    - name: Compile code
      shell: bash
      run: pnpm run build:ts

    # Normalize runner.temp on Windows (backslashes break bash path joins).
    - name: Resolve temp directory
      id: tmp
      shell: bash
      working-directory: ${{ runner.temp }}
      run: echo "tarball-dir=$(pwd)/tarballs" >> $GITHUB_OUTPUT

    - name: Pack packages
      shell: bash
      run: pnpm packages:pack --tarball-dir ${{ steps.tmp.outputs.tarball-dir }}
